[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "twr-python-sdk"
version = "0.1.0"
description = "Python guest API and compatibility ports for Tarantool-Wasm-Rs"
requires-python = ">=3.10"
dependencies = ["msgpack==1.0.3"]

[tool.setuptools]
package-dir = {"" = "sdk/src"}
py-modules = ["_tarantool"]

[tool.setuptools.packages.find]
where = ["sdk/src"]

[tool.setuptools.package-data]
twr_python_sdk = ["wit/*.wit", "wit/sdk/*"]
