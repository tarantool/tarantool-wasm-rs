[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "twr-python-sdk"
version = "0.1.0"
description = "Python compatibility ports for Tarantool-Wasm-Rs"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "sdk/src"}

[tool.setuptools.packages.find]
where = ["sdk/src"]
