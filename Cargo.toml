[package]
name = "tarantool-wasm-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
lazy_static = "1.5.0"
mlua = { version = "0.12.0", features = ["luajit", "module"] }
nix = { version = "0.31.3", features = ["signal"] }
tarantool = "8.0.0"
tokio = "1.53.1"
wasmtime = "41.0.3"
wasmtime-wasi = "41.0.3"
wasmtime-wasi-http = "41.0.3"
wasmtime-wasi-tls = "41.0.3"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libc = "0.2.187"
rmpv = "1.3.1"
flate2 = "1.1.9"
crc32fast = "1.5.0"
adler = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[lib]
crate-type = ["cdylib"]
