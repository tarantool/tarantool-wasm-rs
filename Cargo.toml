[package]
name = "tarantool-wasm-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.94"
lazy_static = "1.5.0"
minicoroutine = "0.1.3"
mlua = { version = "0.10.2", features = ["luajit", "module"] }
nix = { version = "0.29.0", features = ["signal"] }
tarantool = "6.1.0"
tokio = "1.42.0"
wasmtime = "27.0.0"
wasmtime-wasi = "27.0.0"
scopeguard = "1.1.0"
hex = "0.4"
rmp-serde = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
libc = "0.2"

[lib]
crate-type = ["cdylib"]
