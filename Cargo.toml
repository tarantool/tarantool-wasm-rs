[package]
name = "tarantool-wasm-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.0"

[dependencies]
anyhow = "1.0.104"
lazy_static = "1.5.0"
mlua = { version = "0.12.0", features = ["luajit", "module"] }
nix = { version = "0.31.3", features = ["signal"] }
tarantool = { version = "11.0.0", default-features = false }
tokio = "1.53.1"
wasmtime = "49.0.0"
wasmtime-wasi = "49.0.0"
wasmtime-wasi-http = "49.0.0"
wasmtime-wasi-tls = "49.0.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libc = "0.2.187"
rmpv = "1.3.1"
flate2 = "1.1.9"
hashbrown = { version = "0.16.1", default-features = false, features = ["default-hasher", "equivalent", "inline-more"] }
crc32fast = "1.5.0"
adler = "1.0"
async-trait = "0.1.89"
bytes = "1.11.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lib]
crate-type = ["cdylib"]
