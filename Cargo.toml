[package]
name = "tarantool-wasm-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
lazy_static = "1.5.0"
mlua = { version = "0.10.5", features = ["luajit", "module"] }
nix = { version = "0.30.1", features = ["signal"] }
tarantool = "7.0.0"
tokio = "1.45.1"
wasmtime = "33.0.0"
wasmtime-wasi = "33.0.0"
wasmtime-wasi-http = "33.0.0"
wasmtime-wasi-tls = "33.0.0"
scopeguard = "1.1.0"
rmp-serde = "1.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
libc = "0.2"
rmpv = "1.3.0"
flate2 = "1.1.1"
crc32fast = "1.3"
adler = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[lib]
crate-type = ["cdylib"]
