name: SDK runtime
description: Install the shared Linux host artifact and its test dependencies.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: sdk-host-linux-amd64
        path: .rocks/lib/tarantool/

    - uses: ./.github/actions/setup-tarantool
    - name: Load shared host
      shell: bash
      run: |
        test -s .rocks/lib/tarantool/wasm.so
        LUA_CPATH="$PWD/.rocks/lib/tarantool/?.so;;" tarantool -e "require('wasm')" </dev/null
