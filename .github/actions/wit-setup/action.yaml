name: Setup WIT Dependencies
description: Prepare the root WIT dependencies after setup-rust.

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-wkg

    - name: Cache WIT packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/wasm-pkg
          ~/Library/Caches/wasm-pkg
        key: ${{ runner.os }}-wit-packages-${{ hashFiles('wkg.lock') }}

    - name: Init wasi-tls submodule
      run: git submodule update --init --recursive --jobs 8 third-party/wasi-tls
      shell: bash

    - name: Fetch WIT dependencies
      run: wkg wit fetch --type wasm
      shell: bash
