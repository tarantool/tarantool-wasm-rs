name: Setup WIT Dependencies
description: |
  Installs `wkg`, adds Tarantool registry override, initializes wasi-tls submodule,
  and fetches WIT dependencies.

runs:
  using: "composite"
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Install just
      run: cargo install just
      shell: bash

    - name: Install wkg
      run: just install-wkg
      shell: bash

    - name: Add Tarantool wit registry override
      run: just patch-wkg-config
      shell: bash

    - name: Init wasi-tls submodule
      run: just submodule-wasi-tls
      shell: bash

    - name: Fetch WIT dependencies
      run: just wit-fetch
      shell: bash
