name: Python SDK

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    name: Build and test
    # Guest compilation uses Docker bind mounts from the runner checkout.
    runs-on: ubuntu-20.04-self-hosted
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Managed Python also supports fresh Ubuntu 20.04 self-hosted runners.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.7.13'
          enable-cache: false
      - name: Python reference
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/python-reference-managed
        run: |
          uv python install 3.12.11
          uv venv --managed-python --python 3.12.11 --seed "$RUNNER_TEMP/python-reference"
          echo "$RUNNER_TEMP/python-reference/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python-reference/bin/python3" -c 'import sys; assert sys.version_info[:3] == (3, 12, 11), sys.version'
      - name: Unit tests
        run: |
          python3 -m pip install msgpack==1.0.3
          python3 -m unittest discover -s guests/python/tests/unit -p '*_test.py'
      - uses: ./.github/actions/setup-rust
        with:
          rustflags: ''
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - uses: ./.github/actions/setup-wkg
      - name: Build SDK
        run: just python-sdk
      - name: Build guests
        env:
          TWR_PYTHON_IMAGE: mandeser0/tarawasm:latest
        run: |
          if ! docker image inspect "$TWR_PYTHON_IMAGE" >/dev/null 2>&1; then
            docker pull "$TWR_PYTHON_IMAGE"
          fi
          docker run --rm --pull=never --platform linux/amd64 \
            -v "$PWD:/workspace" -w /workspace \
            --entrypoint /bin/bash "$TWR_PYTHON_IMAGE" \
            guests/python/tests/build-components.sh
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk
          path: guests/python/dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: python-components
          path: |
            guests/python/interpreter/*.wasm
            guests/python/tests/components/*/*.wasm
          if-no-files-found: error

  runtime:
    name: Python reference and guest tests
    needs: sdk
    runs-on: ubuntu-20.04-self-hosted
    container:
      image: docker.io/tarantool/testing:ubuntu-jammy
      options: --tmpfs /tmp:rw,exec,mode=1777
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: python-components
          path: guests/python/
      - name: Install SSL runtime for Python SSL tests
        run: |
          apt-get update
          apt-get install -y libssl3
      - uses: ./.github/actions/sdk-runtime
      # Managed Python also supports fresh Ubuntu 20.04 self-hosted runners.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.7.13'
          enable-cache: false
      - name: Python reference
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/python-reference-managed
        run: |
          uv python install 3.12.11
          uv venv --managed-python --python 3.12.11 --seed "$RUNNER_TEMP/python-reference"
          echo "$RUNNER_TEMP/python-reference/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python-reference/bin/python3" -c 'import sys; assert sys.version_info[:3] == (3, 12, 11), sys.version'
      - name: Python reference and guest tests
        shell: bash
        run: |
          python3 -m pip install -r guests/python/interpreter/requirements-build.txt
          python3 - <<'PY'
          import ctypes
          import errno
          import os
          import platform
          import tempfile

          class Iovec(ctypes.Structure):
              _fields_ = [('base', ctypes.c_void_p), ('length', ctypes.c_size_t)]

          # Probe libc directly: managed Python may lack os.pwritev flag support.
          libc = ctypes.CDLL(None, use_errno=True)
          libc.pwritev2.argtypes = [
              ctypes.c_int, ctypes.POINTER(Iovec), ctypes.c_int,
              ctypes.c_longlong, ctypes.c_int,
          ]
          libc.pwritev2.restype = ctypes.c_ssize_t
          payload = ctypes.create_string_buffer(b'next\n')
          vector = Iovec(ctypes.cast(payload, ctypes.c_void_p), 5)
          print(f'Kernel: {platform.release()}; temp dir: {tempfile.gettempdir()}')
          with tempfile.TemporaryFile() as file:
              file.write(b'first-long-record\n')
              file.flush()
              written = libc.pwritev2(file.fileno(), ctypes.byref(vector), 1, 0, 0x10)
              if written == -1:
                  code = ctypes.get_errno()
                  if code not in (errno.ENOSYS, errno.EOPNOTSUPP):
                      raise OSError(code, os.strerror(code))
                  print('RWF_APPEND unavailable; WASI uses the O_APPEND fallback')
              else:
                  assert written == 5, 'Temporary filesystem performed a short append'
                  file.seek(0)
                  assert file.read() == b'first-long-record\nnext\n', \
                      'Temporary filesystem overwrites files instead of appending'
          PY
          python3 guests/python/tests/integration/ssl_bio_cases.py guests/python/tests/fixtures/ssl
          python3 guests/python/tests/integration/ssl_socket_cases.py guests/python/tests/fixtures/ssl
          python3 guests/python/tests/integration/ssl_asyncio_cases.py guests/python/tests/fixtures/ssl
          python3 guests/python/tests/conformance/generate.py > "$RUNNER_TEMP/ssl-conformance-native.json"
          python3 guests/python/tests/conformance/native.py > "$RUNNER_TEMP/ssl-conformance-native-full.json"
          TWR_SSL_CONFORMANCE_REPORT="$RUNNER_TEMP/ssl-conformance-guest.json" \
            bash guests/python/test.sh
          timeout --kill-after=10s 300s luatest -v test/lualib/interpreter_api_test.lua
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssl-conformance-linux
          path: ${{ runner.temp }}/ssl-conformance-*.json
