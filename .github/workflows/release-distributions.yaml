name: Distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: release (${{ matrix.image }})
    runs-on: ubuntu-20.04-self-hosted
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
          - tarantool/testing:ubuntu-jammy
          - packpack/packpack:debian-bookworm
          - packpack/packpack:fedora-39
          - packpack/packpack:centos-8
          - packpack/packpack:redos-7.3
          - packpack/packpack:astra-1.7
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sdk-runtime
      - name: Test
        run: timeout --kill-after=10s 1800s luatest -v -l luatest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distro-${{ strategy.job-index }}-log
          path: luatest.log
          if-no-files-found: warn
