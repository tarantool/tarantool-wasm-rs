name: Go SDK
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'full-ci') ||
          contains(github.event.pull_request.labels.*.name, 'sdk-ci') }}
    runs-on: ubuntu-20.04-self-hosted
    container:
      image: docker.io/tarantool/testing:ubuntu-jammy
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/.go-ci-tarawasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: guests/go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout tarawasm latest
        uses: actions/checkout@v4
        with:
          repository: mandesero/tarawasm
          ref: master
          path: .go-ci-tarawasm
      - name: Prepare toolchain locations
        run: |
          printf '%s\n' \
            "TARAWASM_CONFIG_HOME=$RUNNER_TEMP/go-tarawasm-config" \
            "TARAWASM_DATA_HOME=$RUNNER_TEMP/go-tarawasm-tools" \
            "WKG_CONFIG_FILE=$RUNNER_TEMP/go-wkg.toml" >> "$GITHUB_ENV"
      - name: Install Go and common Wasm tools
        run: |
          python3 -m pip install -r .go-ci-tarawasm/requirements.txt
          python3 -m tarawasm.cli toolchain setup go --mode local --install --yes --upgrade
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          import sys
          from tarawasm.toolchains.discovery import managed_environment
          print(f"TWR_GO_PYTHON={sys.executable}")
          with open(os.environ['GITHUB_PATH'], 'a') as paths:
              for path in reversed(managed_environment()['PATH'].split(os.pathsep)):
                  if path:
                      print(path, file=paths)
          PY
      - name: Check workflow and selected versions
        run: |
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -config-file guests/go/tests/actionlint.yaml .github/workflows/guests-go.yml
          for tool in go tinygo wkg wasm-tools wasm-opt; do command -v "$tool"; done
          "$TWR_GO_PYTHON" -m tarawasm.cli doctor --lang go --json
          bash scripts/add_tarantool_registry.sh
      - name: Formatting, static checks, unit tests and archive installation
        working-directory: guests/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          bash tests/pack.sh
      - name: Build installed SDK components through tarawasm and directly
        run: bash guests/go/tests/build-components.sh
      - name: Compare SDK and raw API with freshly fetched released WIT
        working-directory: guests/go
        run: TWR_GO_WIT="$PWD/dist/released-tarantool.wit" go test -run TestReleasedWITCoverage -v .
      - uses: actions/upload-artifact@v4
        with:
          name: go-sdk
          path: |
            guests/go/dist/
            guests/go/tests/components/*/*.wasm
          if-no-files-found: error
  peers:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'full-ci') ||
          contains(github.event.pull_request.labels.*.name, 'sdk-ci') }}
    runs-on: ubuntu-20.04-self-hosted
    container:
      image: docker.io/tarantool/testing:ubuntu-jammy
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/.go-ci-tarawasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'
          cache: npm
          cache-dependency-path: guests/js/package-lock.json
      - name: Checkout tarawasm latest
        uses: actions/checkout@v4
        with:
          repository: mandesero/tarawasm
          ref: master
          path: .go-ci-tarawasm
      - name: Prepare explicit cross-language compilers
        run: |
          printf '%s\n' \
            "TARAWASM_CONFIG_HOME=$RUNNER_TEMP/go-peer-config" \
            "TARAWASM_DATA_HOME=$RUNNER_TEMP/go-peer-tools" \
            "WKG_CONFIG_FILE=$RUNNER_TEMP/go-peer-wkg.toml" >> "$GITHUB_ENV"
      - name: Install Python and JS exchange tools
        run: |
          python3 -m pip install -r .go-ci-tarawasm/requirements.txt
          python3 -m tarawasm.cli toolchain setup python --mode local --install --yes
          python3 -m tarawasm.cli toolchain setup js --mode local --install --yes
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          import sys
          from tarawasm.toolchains.discovery import managed_environment
          print(f"TWR_GO_PYTHON={sys.executable}")
          with open(os.environ['GITHUB_PATH'], 'a') as paths:
              for path in reversed(managed_environment()['PATH'].split(os.pathsep)):
                  if path:
                      print(path, file=paths)
          PY
      - name: Build, strip and validate exchange peers
        run: |
          bash scripts/add_tarantool_registry.sh
          bash guests/go/tests/build-peers.sh
      - uses: actions/upload-artifact@v4
        with:
          name: go-exchange-peers
          path: guests/go/tests/components/*-peer/*.wasm
          if-no-files-found: error
  runtime:
    needs: [sdk, peers]
    runs-on: ubuntu-20.04-self-hosted
    container:
      image: docker.io/tarantool/testing:ubuntu-jammy
    timeout-minutes: 90
    env:
      WKG_CONFIG_FILE: ${{ github.workspace }}/.go-ci-wkg.toml
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: sudo sh scripts/install_openssl_dependencies.sh
      - uses: tarantool/setup-tarantool@v3
        with:
          tarantool-version: '3.7'
      - name: tt
        run: |
          curl -L https://tarantool.io/release/2/installer.sh | sudo bash
          sudo apt-get install -y tt
      - uses: ./.github/actions/wit-setup
        with:
          rustflags: ''
      - name: Build host
        run: |
          cargo build --locked --release
          mkdir -p .rocks/lib/tarantool
          cp target/release/libtarantool_wasm_rs.so .rocks/lib/tarantool/wasm.so
          tt rocks install luatest
      - uses: actions/download-artifact@v4
        with:
          name: go-sdk
          path: guests/go/
      - uses: actions/download-artifact@v4
        with:
          name: go-exchange-peers
          path: guests/go/tests/components/
      - name: Go SDK and Python/JS exchange in Wasm
        run: |
          status=0
          bash guests/go/tests/test-runtime.sh || status=$?
          cp luatest.log go-sdk-luatest.log
          exit "$status"
      - name: Local standard-library capability audit
        run: |
          export PATH="$PWD/.rocks/bin:$PATH"
          status=0
          timeout --kill-after=10s 300s luatest -v -l luatest.log guests/go/tests/integration/capabilities_test.lua || status=$?
          cp luatest.log go-capabilities-luatest.log
          exit "$status"
      - name: Full Lua regression suite
        run: |
          export PATH="$PWD/.rocks/bin:$PATH"
          status=0
          timeout --kill-after=10s 1800s luatest -v -l luatest.log test/ || status=$?
          cp luatest.log go-regression-luatest.log
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-sdk-runtime-observations
          path: |
            guests/go/dist/capabilities-observed.json
            guests/go/dist/toolchain-observed.txt
            luatest.log
            go-*-luatest.log
          if-no-files-found: warn
