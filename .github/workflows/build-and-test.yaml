name: Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Install just
        run: sudo apt update && sudo apt install -y just

      - name: Build all
        run: just

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            target/

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-build

      - name: Install Tarantool CLI (tt)
        run: |
          curl -L https://tarantool.io/release/3/installer.sh | bash 
          sudo apt-get install -y tt

      - name: Install just
        run: sudo apt update && sudo apt install -y just

      - name: Install Tarantool system dependencies
        run: |
          sudo apt-get install -y \
            git build-essential cmake autoconf automake libtool make \
            zlib1g-dev libreadline-dev libncurses5-dev libssl-dev \
            libunwind-dev libicu-dev python3 python3-yaml \
            python3-six python3-gevent

      - name: Build tarantool with WASM support
        run: |
          just submodules
          just build-tarantool

      - name: Install luatest
        run: just install-luatest

      - name: Run tests
        run: just test
