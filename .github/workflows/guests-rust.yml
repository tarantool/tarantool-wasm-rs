name: Rust SDK

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'full-ci') ||
          contains(github.event.pull_request.labels.*.name, 'sdk-ci') }}
    runs-on: ubuntu-20.04-self-hosted
    container:
      image: docker.io/tarantool/testing:ubuntu-jammy
    timeout-minutes: 60
    env:
      WKG_CONFIG_FILE: ${{ github.workspace }}/.rust-ci-wkg.toml
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: sudo sh scripts/install_openssl_dependencies.sh
      - uses: tarantool/setup-tarantool@v3
        with:
          tarantool-version: '3.7'
      - name: tt
        run: |
          curl -L https://tarantool.io/release/2/installer.sh | sudo bash
          sudo apt-get install -y tt
      - uses: ./.github/actions/wit-setup
        with:
          rustflags: ''
      - name: Rust guest tools
        run: |
          rustup target add wasm32-wasip2
          cargo install wasm-tools --version 1.261.0 --locked
          cargo install just --version 1.58.0 --locked
      - name: SDK checks
        run: |
          just rust-sdk
          cargo check --locked --manifest-path guests/rust/Cargo.toml --all-targets
          cargo test --locked --manifest-path guests/rust/Cargo.toml
      - name: Check packaged SDK offline
        run: |
          cargo check --locked --offline \
            --manifest-path guests/rust/target/package/tarantool-wasm-0.1.0/Cargo.toml \
            --target wasm32-wasip2
      - name: Build, strip and validate guest
        run: |
          cargo build --locked --manifest-path guests/rust/tests/component/Cargo.toml --target wasm32-wasip2 --release
          component=guests/rust/tests/component/target/wasm32-wasip2/release/rust_sdk_test.wasm
          wasm-tools strip "$component" -o "$component.stripped"
          mv "$component.stripped" "$component"
          wasm-tools validate "$component"
      - name: Build host and run SDK in Tarantool
        run: |
          cargo build --locked --release
          mkdir -p .rocks/lib/tarantool
          cp target/release/libtarantool_wasm_rs.so .rocks/lib/tarantool/wasm.so
          tt rocks install luatest
          bash guests/rust/tests/test-runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rust-sdk
          path: guests/rust/target/package/*.crate
          if-no-files-found: error
