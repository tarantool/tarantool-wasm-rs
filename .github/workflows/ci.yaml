name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  udeps:
    uses: ./.github/workflows/udeps.yaml

  ubuntu:
    uses: ./.github/workflows/test-ubuntu.yaml

  linux:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'full-ci') ||
          contains(github.event.pull_request.labels.*.name, 'sdk-ci') }}
    uses: ./.github/workflows/build-linux.yaml

  distributions:
    needs: linux
    if: >-
      ${{ github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    uses: ./.github/workflows/release-distributions.yaml

  sdk:
    needs: linux
    uses: ./.github/workflows/sdk.yml

  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test-macos.yaml

  artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, udeps, ubuntu, linux, distributions, sdk, macos]
    uses: ./.github/workflows/release-artifacts.yaml
