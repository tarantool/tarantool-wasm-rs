name: Test Ubuntu

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: debug (ubuntu-jammy)
    runs-on: ubuntu-20.04-self-hosted
    container:
      image: docker.io/tarantool/testing:ubuntu-jammy
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-openssl
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/wit-setup
      - name: Build debug host
        run: |
          cargo build --locked
          mkdir -p .rocks/lib/tarantool
          cp target/debug/libtarantool_wasm_rs.so .rocks/lib/tarantool/wasm.so
      - uses: ./.github/actions/setup-tarantool
      - name: Run all tests
        run: timeout --kill-after=10s 1800s luatest -v -l luatest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-debug-log
          path: luatest.log
          if-no-files-found: warn
