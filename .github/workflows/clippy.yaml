name: Clippy check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  clippy_check:
    container:
      image: docker.io/tarantool/testing:ubuntu-jammy

    runs-on: ubuntu-20.04-self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: OpenSSL deps
        run: sudo sh scripts/install_openssl_dependencies.sh

      - name: Setup WIT
        uses: ./.github/actions/wit-setup

      - name: Rust tools
        run: rustup component add clippy rustfmt

      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
