name: Clippy check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  library:
    name: Main library lint
    container:
      image: docker.io/tarantool/testing:ubuntu-jammy

    runs-on: ubuntu-20.04-self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: OpenSSL deps
        run: sudo sh scripts/install_openssl_dependencies.sh

      - name: Setup WIT
        uses: ./.github/actions/wit-setup

      - name: Rust tools
        run: |
          rustup component add clippy rustfmt

      - name: Check main library
        run: |
          cargo fmt --package tarantool-wasm-rs -- --check
          cargo clippy --locked --package tarantool-wasm-rs --all-targets --all-features -- -D warnings
          cargo clippy --locked --package tarantool-wasm-rs --all-targets --no-default-features -- -D warnings
