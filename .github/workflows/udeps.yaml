name: Unused Rust dependencies

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-20.04-self-hosted
    container:
      image: docker.io/tarantool/testing:ubuntu-jammy
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-openssl
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - uses: ./.github/actions/wit-setup
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps@0.1.61
      - name: Check unused dependencies
        run: cargo +nightly udeps
