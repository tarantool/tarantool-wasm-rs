on: push
name: Clippy check

# Make sure CI fails on all warnings, including Clippy lints
env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  clippy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wkg
        run: cargo install wkg

      - name: Add Tarantool wit registry override
        run: ./scripts/add_tarantool_registry.sh

      - name: Init wasi-tls submodule
        run: git submodule update --init --recursive third-party/wasi-tls

      - name: Fetch WIT dependencies
        run: wkg wit fetch

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features
