name: Clippy check

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  clippy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup WIT
        uses: ./.github/actions/wit-setup

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features
