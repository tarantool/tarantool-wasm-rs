name: Test macOS

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: release (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Parallelize submodule fetching
        run: git config --global submodule.fetchJobs 8

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install tarantool tt coreutils pkg-config openssl@3
          tarantool --version
          tt version
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Set WIT registry config path
        run: |
          echo "WKG_CONFIG_FILE=$RUNNER_TEMP/wkg-config.toml" >> "$GITHUB_ENV"
          echo 'default_registry = "wasi.dev"' > "$RUNNER_TEMP/wkg-config.toml"

      - uses: ./.github/actions/setup-rust
        with:
          # RUSTFLAGS would override the macOS linker flags in .cargo/config.toml.
          rustflags: ''

      - uses: ./.github/actions/wit-setup

      - name: Build and install (release)
        run: |
          cargo build --locked --release
          mkdir -p .rocks/lib/tarantool
          cp target/release/libtarantool_wasm_rs.dylib .rocks/lib/tarantool/wasm.dylib

      - name: Add local rocks to PATH
        run: echo "$PWD/.rocks/bin" >> "$GITHUB_PATH"

      - name: Install luatest
        run: tt rocks install luatest

      - name: Run all test files
        shell: bash
        run: |
          # Separate processes avoid the macOS unwind-registration hang when
          # unloading all fixtures together. Timeouts still fail the job.
          shopt -s nullglob
          tests=(test/*/*_test.lua)
          if (( ${#tests[@]} == 0 )); then
            echo "No Lua test files found" >&2
            exit 1
          fi
          result=0
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            rm -f luatest.log
            if ! gtimeout --kill-after=10s 300s luatest -v -l luatest.log "$test_file"; then
              result=1
            fi
            echo "::endgroup::"
          done
          exit "$result"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - name: Prepare tested runtime
        run: just package-runtime target/release/libtarantool_wasm_rs.dylib macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-macos-arm64
          path: dist/tarantool-wasm-*-macos-arm64.dylib
          if-no-files-found: error
